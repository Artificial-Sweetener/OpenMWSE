[[waivers]]
id = "OMWSE-STRUCTURAL-001"
area = "graphics-settings-ui"
owner = "OpenMWSE graphics settings UI"
rule = "STRUCT003"
path = "apps/launcher/settingspage.cpp"
kind = "structural"
justification = "The launcher settings page is one Qt form controller with a single load, validation, enablement, and save lifecycle. Its category-specific controls all bind the same form state and persistence boundary; splitting by category would duplicate widget coordination and make atomic apply behavior harder to verify."
