rule = "STRUCT003"
path = "apps/openmw/diagnosticperformance.cpp"
kind = "structural"
justification = "This translation unit owns one diagnostic performance report pipeline from sampled viewer statistics through attribution, distribution calculation, and stable serialization. The internal metric records are private stages of that pipeline, share one frame-time model, and have no independent runtime lifecycle."
